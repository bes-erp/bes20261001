# ==============================================================================
#  BES 로컬 개발환경 Nginx 설정
#  작성일            : 2026.10.28
#  수정일            : 2026.11.14  (세션 쿠키 경로 보정, 캐시 비활성화, 중복 설정 정리)
#  프로젝트          : BES
#  Nexacro UI 원본   : E:/BES/workspace/bes/src/main/bes-ui
#  Nexacro UI 컴파일 : E:/BES/workspace/bes/src/main/webapp/bes-ui
#  Nginx HTTP 포트   : 8011  (브라우저 접속 주소: http://localhost:8011/)
#  Tomcat HTTP 포트  : 8080  (Eclipse Server)
#
#  요청 흐름
#    /                → /bes-ui/ 로 이동
#    /bes-ui/         → Nexacro 컴파일 결과 (정적 파일, nginx 직접 제공)
#    /css/ /images/ /html/ → webapp 정적 리소스 (nginx 직접 제공)
#    /export/         → 다운로드 파일 (Eclipse 배포 폴더, nginx 직접 제공)
#    /bes/            → Tomcat /built1/ 로 경로 변경 후 전달 (Nexacro svcUrl)
#    *.do *.jsp *.scr → Tomcat 으로 경로 그대로 전달
#    /XExportImportServlet → Tomcat 으로 전달 (Nexacro 엑셀 내보내기/가져오기)
#
#  ※ 이 파일은 반드시 UTF-8(BOM 없음)으로 저장하세요.
#    BOM이 있으면 nginx가 첫 줄을 인식하지 못해 시작에 실패합니다.
# ==============================================================================

# 워커 프로세스 수 (Windows 버전 nginx는 1 권장)
worker_processes  1;

# 에러 로그 (nginx 설치 폴더 기준 logs\error.log)
# 시작 실패, 502 오류 등 문제가 생기면 이 파일을 먼저 확인하세요.
error_log  logs/error.log;

events {
    # 워커 1개당 최대 동시 연결 수
    worker_connections  1024;
}

http {
    # --------------------------------------------------------------------------
    #  공통 설정
    # --------------------------------------------------------------------------

    # 확장자별 Content-Type 매핑 (conf\mime.types)
    include       mime.types;
    default_type  application/octet-stream;

    # 접근 로그 (logs\access.log)
    access_log    logs/access.log;

    # 정적 파일 전송 최적화
    sendfile      on;

    # 브라우저와의 HTTP 연결 유지 시간(초)
    keepalive_timeout  65;

    # ==========================================================================
    #  BES 로컬 개발 서버
    # ==========================================================================
    server {
        listen       8011;
        server_name  localhost;

        # 업로드 최대 크기 (초과 시 413 Request Entity Too Large)
        client_max_body_size  20M;

        # ----------------------------------------------------------------------
        #  Tomcat 프록시 공통 설정
        #  아래 프록시 location 들이 모두 이 설정을 물려받습니다.
        #  ※ 주의: location 안에 proxy_set_header 를 하나라도 따로 쓰면
        #          여기 있는 proxy_set_header 가 해당 location 에서 전부 무시됩니다.
        #          헤더를 추가해야 할 경우 여기에 추가하세요.
        # ----------------------------------------------------------------------

        # Tomcat 과 HTTP/1.1 로 통신
        proxy_http_version  1.1;

        # 원래 요청 정보를 Tomcat 에 전달
        #   Host              : 브라우저가 접속한 호스트:포트 (localhost:8011)
        #   X-Real-IP         : 실제 클라이언트 IP
        #   X-Forwarded-For   : 프록시를 거친 클라이언트 IP 목록
        #   X-Forwarded-Proto : 원래 요청 프로토콜 (http / https)
        proxy_set_header  Host               $http_host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  $scheme;

        # 대기 시간 (오래 걸리는 조회/배치/엑셀 처리 대비 10분)
        #   proxy_connect_timeout : Tomcat 연결 시도 제한 시간
        #   proxy_send_timeout    : Tomcat 으로 요청 전송 제한 시간
        #   proxy_read_timeout    : Tomcat 응답 대기 시간
        #   send_timeout          : 브라우저로 응답 전송 제한 시간
        proxy_connect_timeout  60s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;
        send_timeout           600s;

        # ----------------------------------------------------------------------
        #  [1] 기본 접속 → Nexacro UI 로 이동
        #  http://localhost:8011/ 접속 시 /bes-ui/ 로 리다이렉트
        # ----------------------------------------------------------------------
        location = / {
            return 302 /bes-ui/;
        }

        # ----------------------------------------------------------------------
        #  [2] Nexacro UI (컴파일 결과)
        #  예) /bes-ui/index.html → E:/BES/workspace/bes/src/main/webapp/bes-ui/index.html
        #  ※ 실제 진입 파일이 index.html 인지 확인 필요
        #  ※ location 과 alias 끝의 / 는 반드시 맞춰서 붙여야 합니다.
        # ----------------------------------------------------------------------
        location /bes-ui/ {
            alias  E:/BES/workspace/bes/src/main/webapp/bes-ui/;
            index  index.html index.htm;

            # 브라우저 캐시 비활성화
            # Nexacro 재컴파일 후 새로고침만으로 변경 사항이 바로 반영됩니다.
            # (운영 환경에서는 제거 권장)
            add_header  Cache-Control  "no-cache, no-store, must-revalidate";
            expires     off;
        }

        # ----------------------------------------------------------------------
        #  [3] 기존 프로젝트 정적 리소스
        #  root 는 요청 경로를 그대로 붙입니다.
        #  예) /css/common.css → E:/BES/workspace/bes/src/main/webapp/css/common.css
        #  ※ 실제 폴더가 존재하고 사용하는 경우에만 유지
        # ----------------------------------------------------------------------
        location /css/ {
            root  E:/BES/workspace/bes/src/main/webapp;
        }

        location /images/ {
            root  E:/BES/workspace/bes/src/main/webapp;
        }

        location /html/ {
            root  E:/BES/workspace/bes/src/main/webapp;
        }

        # ----------------------------------------------------------------------
        #  [4] 파일 다운로드
        #  Eclipse(WTP) 배포 폴더에서 직접 제공
        #  예) /export/a.xlsx → .../wtpwebapps/bes/export/a.xlsx
        #  ※ Eclipse 에서 서버를 삭제 후 다시 만들면 tmp0 가 tmp1 등으로
        #    바뀔 수 있으니, 다운로드가 안 되면 이 경로부터 확인하세요.
        # ----------------------------------------------------------------------
        location /export/ {
            root  E:/BES/workspace/.metadata/.plugins/org.eclipse.wst.server.core/tmp0/wtpwebapps/bes;
        }

        # ======================================================================
        #  Tomcat 프록시 (Eclipse Server HTTP/1.1 포트 : 8080)
        #  Tomcat 이 꺼져 있으면 502 오류 → [8] 오류 페이지가 표시됩니다.
        # ======================================================================

        # ----------------------------------------------------------------------
        #  [5] Nexacro svcUrl → Tomcat /built1/
        #  예) /bes/user/list.do → http://localhost:8080/built1/user/list.do
        #  ^~ : 이 경로로 시작하면 아래 정규식 location(.do 등)보다 우선 처리
        # ----------------------------------------------------------------------
        location ^~ /bes/ {
            proxy_pass  http://localhost:8080/built1/;

            # 세션 쿠키 경로 보정
            # Tomcat 은 JSESSIONID 를 Path=/built1 로 발급하는데, 브라우저는 /bes/ 로
            # 요청하므로 그대로 두면 쿠키가 전송되지 않아 로그인/세션이 유지되지 않습니다.
            proxy_cookie_path  /built1  /bes;

            # 리다이렉트 경로 보정
            # Tomcat 이 /built1/... 로 리다이렉트하면 브라우저에는 /bes/... 로 바꿔서 전달
            proxy_redirect     /built1/  /bes/;
        }

        # ----------------------------------------------------------------------
        #  [6] 전자정부프레임워크 Controller(.do), JSP(.jsp), SCR(.scr) 요청
        #  경로를 바꾸지 않고 그대로 Tomcat 에 전달
        #  예) /built1/login.do → http://localhost:8080/built1/login.do
        #  ※ proxy_pass 끝에 / 나 경로를 붙이지 않아야 원래 경로가 유지됩니다.
        # ----------------------------------------------------------------------
        location ~ \.(do|jsp|scr)$ {
            proxy_pass  http://localhost:8080;
        }

        # ----------------------------------------------------------------------
        #  [7] Nexacro 파일 내보내기 / 가져오기 (엑셀 등)
        # ----------------------------------------------------------------------
        location ~ /XExportImportServlet {
            proxy_pass  http://localhost:8080;
        }

        # ----------------------------------------------------------------------
        #  [8] 오류 페이지
        #  파일 위치: E:\BES\servers\nginx-1.30.6\html\50x.html
        # ----------------------------------------------------------------------
        error_page  500 502 503 504  /50x.html;

        location = /50x.html {
            root  html;
        }
    }
}
